<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personagens - Rick and Morty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Personagens</h1>

  <input type="text" id="busca" placeholder="Buscar por personagem">

<div class="filtros">
  <button onclick="mostrarTodos()">Todos</button>
  <button onclick="mostrarSoFavoritos()">Ver favoritos</button>

  <select id="filtroStatus" onchange="filtrarPorStatus()">
    <option value="todos">Todos os status</option>
    <option value="Alive">Vivo</option>
    <option value="Dead">Morto</option>
    <option value="unknown">Desconhecido</option>
  </select>

</div>

  <div id="lista"></div>
  
    <button onclick="carregarMais()" class="carregar-mais">Carregar mais</button>

  <script src="app.js"></script>
</body>
</html>
